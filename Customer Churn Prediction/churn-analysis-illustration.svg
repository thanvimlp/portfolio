<svg viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="900" height="500" fill="#0d1117"/>
  <text x="450" y="45" text-anchor="middle" fill="#ffffff" font-size="26" font-weight="bold">Customer Churn Analysis</text>

  <!-- Left panel: customers leaving vs staying -->
  <rect x="30" y="80" width="280" height="380" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="170" y="115" text-anchor="middle" fill="#c9d1d9" font-size="15" font-weight="bold">Customer Base</text>

  <!-- staying customers (grid of green people icons) -->
  <g fill="#3fb950">
    <circle cx="70" cy="160" r="10"/><rect x="60" y="172" width="20" height="26" rx="6"/>
    <circle cx="115" cy="160" r="10"/><rect x="105" y="172" width="20" height="26" rx="6"/>
    <circle cx="160" cy="160" r="10"/><rect x="150" y="172" width="20" height="26" rx="6"/>
    <circle cx="205" cy="160" r="10"/><rect x="195" y="172" width="20" height="26" rx="6"/>
    <circle cx="250" cy="160" r="10"/><rect x="240" y="172" width="20" height="26" rx="6"/>
    <circle cx="70" cy="215" r="10"/><rect x="60" y="227" width="20" height="26" rx="6"/>
    <circle cx="115" cy="215" r="10"/><rect x="105" y="227" width="20" height="26" rx="6"/>
    <circle cx="160" cy="215" r="10"/><rect x="150" y="227" width="20" height="26" rx="6"/>
  </g>
  <!-- churned customers (grey/red, with exit arrow) -->
  <g fill="#f85149" opacity="0.85">
    <circle cx="205" cy="215" r="10"/><rect x="195" y="227" width="20" height="26" rx="6"/>
    <circle cx="250" cy="215" r="10"/><rect x="240" y="227" width="20" height="26" rx="6"/>
  </g>
  <line x1="290" y1="235" x2="330" y2="235" stroke="#f85149" stroke-width="3" marker-end="url(#redarrow)"/>

  <text x="170" y="285" text-anchor="middle" fill="#3fb950" font-size="13" font-weight="bold">● Retained: 82%</text>
  <text x="170" y="308" text-anchor="middle" fill="#f85149" font-size="13" font-weight="bold">● Churned: 18%</text>

  <!-- donut chart -->
  <g transform="translate(170,380)">
    <circle r="55" fill="none" stroke="#21262d" stroke-width="22"/>
    <circle r="55" fill="none" stroke="#3fb950" stroke-width="22"
      stroke-dasharray="282.6 345.6" stroke-dashoffset="0" transform="rotate(-90)"/>
    <circle r="55" fill="none" stroke="#f85149" stroke-width="22"
      stroke-dasharray="62.2 345.6" stroke-dashoffset="-282.6" transform="rotate(-90)"/>
    <text x="0" y="6" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="bold">18%</text>
  </g>

  <!-- Right panel: churn drivers bar chart -->
  <rect x="340" y="80" width="530" height="380" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="605" y="115" text-anchor="middle" fill="#c9d1d9" font-size="15" font-weight="bold">Churn Rate by Contract Type</text>

  <!-- axis -->
  <line x1="420" y1="400" x2="820" y2="400" stroke="#8b949e" stroke-width="1.5"/>
  <line x1="420" y1="150" x2="420" y2="400" stroke="#8b949e" stroke-width="1.5"/>

  <!-- bars -->
  <rect x="460" y="220" width="70" height="180" fill="#f85149"/>
  <text x="495" y="212" text-anchor="middle" fill="#f85149" font-size="13" font-weight="bold">42%</text>
  <text x="495" y="420" text-anchor="middle" fill="#c9d1d9" font-size="11">Month-to-month</text>

  <rect x="580" y="320" width="70" height="80" fill="#db6d28"/>
  <text x="615" y="312" text-anchor="middle" fill="#db6d28" font-size="13" font-weight="bold">19%</text>
  <text x="615" y="420" text-anchor="middle" fill="#c9d1d9" font-size="11">One-year</text>

  <rect x="700" y="370" width="70" height="30" fill="#3fb950"/>
  <text x="735" y="362" text-anchor="middle" fill="#3fb950" font-size="13" font-weight="bold">7%</text>
  <text x="735" y="420" text-anchor="middle" fill="#c9d1d9" font-size="11">Two-year</text>

  <text x="605" y="450" text-anchor="middle" fill="#8b949e" font-size="12" font-style="italic">Short-term contracts churn far more than long-term ones</text>

  <defs>
    <marker id="redarrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#f85149"/>
    </marker>
  </defs>
</svg>
